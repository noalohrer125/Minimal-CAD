name: Deploy to Firebase Hosting (Dev)

on:
  push:
    branches:
      - main # Deploy DEV when pushing to main branch

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: minimalcad-dev
      GCP_REGION: europe-west6
      CLOUD_RUN_SERVICE: minimalcad-stl-step-api-dev
      API_CONTEXT_DIR: ./Minimal-CAD/src/app/shared/stl-to-step_api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect API changes
        id: api_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'Minimal-CAD/src/app/shared/stl-to-step_api/Dockerfile'
              - 'Minimal-CAD/src/app/shared/stl-to-step_api/**/*.py'
              - 'Minimal-CAD/src/app/shared/stl-to-step_api/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Minimal-CAD/package-lock.json

      - name: Cache Firebase Tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase
          key: ${{ runner.os }}-firebase-tools

      - name: Install dependencies
        working-directory: ./Minimal-CAD
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        working-directory: ./Minimal-CAD
        run: npm test

      - name: Build application (DEV config)
        working-directory: ./Minimal-CAD
        run: npm run build -- --configuration=dev

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud (DEV)
        if: steps.api_changes.outputs.api == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY_DEV }}"

      - name: Setup gcloud
        if: steps.api_changes.outputs.api == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build API container image (DEV)
        if: steps.api_changes.outputs.api == 'true'
        run: |
          gcloud builds submit "${{ env.API_CONTEXT_DIR }}" \
            --tag "gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"

      - name: Deploy API to Cloud Run (DEV)
        if: steps.api_changes.outputs.api == 'true'
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --concurrency 1 \
            --timeout 300 \
            --cpu 2 \
            --memory 2Gi

      - name: Skip API build and deploy (DEV)
        if: steps.api_changes.outputs.api != 'true'
        run: echo "No API Dockerfile or Python changes detected. Skipping Cloud Run
          build and deploy."

      - name: Deploy to Firebase Dev (minimalcad-dev)
        working-directory: ./Minimal-CAD
        run: |
          firebase deploy \
            --only hosting,firestore:rules \
            --config firebase.json \
            --project minimalcad-dev \
            --token "${{ secrets.FIREBASE_TOKEN }}"
