# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Angular frontend (package.json liegt in /Minimal-CAD, nicht im Repo-Root)
  - package-ecosystem: "npm"
    directory: "/Minimal-CAD"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Angular-Pakete muessen immer als Block auf dem gleichen Major liegen.
      # Ohne Gruppierung entstehen halb migrierte Staende, die npm nicht mehr
      # aufloesen kann (ERESOLVE zwischen @angular/build und @angular/compiler-cli).
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
        update-types:
          - "minor"
          - "patch"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "@types/jest"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Angular-Major-Upgrades nur manuell: @angular/fire haengt hinterher
      # (neuestes Release peert @angular/core ^21) und jest-preset-angular
      # unterstuetzt jeweils nur bestimmte compiler-cli-Ranges.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Bewusst auf der RC gepinnt, solange es kein stabiles Angular-21-Release gibt
      - dependency-name: "@angular/fire"

  # Python-API fuer die STL-nach-STEP-Konvertierung
  - package-ecosystem: "pip"
    directory: "/Minimal-CAD/src/app/shared/stl-to-step_api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Basis-Image der API
  - package-ecosystem: "docker"
    directory: "/Minimal-CAD/src/app/shared/stl-to-step_api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # GitHub Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
